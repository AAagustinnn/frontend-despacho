apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: despacho-eks
  region: us-east-1

availabilityZones:
  - us-east-1a
  - us-east-1b

managedNodeGroups:
  - name: despacho-workers
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    volumeSize: 20
    privateNetworking: false
    labels:
      role: worker
    tags:
      proyecto: despacho
      evaluacion: ep3
