name: CI/CD Despacho EKS

on:
  push:
    branches:
      - main
      - deploy
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  EKS_NAMESPACE: despacho
  FRONTEND_REPOSITORY: frontend-despacho
  BACKEND_REPOSITORY: backend-despacho

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repositories
        run: |
          aws ecr describe-repositories --repository-names "$FRONTEND_REPOSITORY" >/dev/null 2>&1 || aws ecr create-repository --repository-name "$FRONTEND_REPOSITORY"
          aws ecr describe-repositories --repository-names "$BACKEND_REPOSITORY" >/dev/null 2>&1 || aws ecr create-repository --repository-name "$BACKEND_REPOSITORY"

      - name: Build and push frontend image
        env:
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t "$REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$FRONTEND_REPOSITORY:latest" .
          docker push "$REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$FRONTEND_REPOSITORY:latest"

      - name: Build and push backend image
        env:
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -f Dockerfile.backend -t "$REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$BACKEND_REPOSITORY:latest" .
          docker push "$REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$BACKEND_REPOSITORY:latest"

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Deploy to EKS
        env:
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          FRONTEND_IMAGE="$REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG"
          BACKEND_IMAGE="$REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG"
          sed -i "s|FRONTEND_IMAGE|$FRONTEND_IMAGE|g" k8s/frontend-deployment.yaml
          sed -i "s|BACKEND_IMAGE|$BACKEND_IMAGE|g" k8s/back-ventas-deployment.yaml
          sed -i "s|BACKEND_IMAGE|$BACKEND_IMAGE|g" k8s/back-despachos-deployment.yaml
          kubectl apply -k k8s
          kubectl rollout status deployment/frontend-despacho -n "$EKS_NAMESPACE" --timeout=180s
          kubectl rollout status deployment/back-ventas -n "$EKS_NAMESPACE" --timeout=180s
          kubectl rollout status deployment/back-despachos -n "$EKS_NAMESPACE" --timeout=180s

      - name: Show runtime evidence
        if: always()
        run: |
          kubectl get pods,svc,hpa -n "$EKS_NAMESPACE" -o wide || true
          kubectl logs deployment/back-ventas -n "$EKS_NAMESPACE" --tail=30 || true
          kubectl logs deployment/back-despachos -n "$EKS_NAMESPACE" --tail=30 || true
