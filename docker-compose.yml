services:
  back-ventas:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: back-ventas
    environment:
      SERVICE_NAME: back-ventas
      APP_API_TOKEN: local-demo-token
    ports:
      - "8081:8080"
    networks:
      - despacho-net

  back-despachos:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: back-despachos
    environment:
      SERVICE_NAME: back-despachos
      APP_API_TOKEN: local-demo-token
    ports:
      - "8082:8080"
    networks:
      - despacho-net

  frontend:
    build: .
    container_name: frontend-despacho
    restart: always
    depends_on:
      - back-ventas
      - back-despachos
    ports:
      - "80:80"
    networks:
      - despacho-net

networks:
  despacho-net:
    driver: bridge
