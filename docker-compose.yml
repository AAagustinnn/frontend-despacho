name: CI/CD Frontend Despacho

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/frontend-despacho:latest
          build-args: |
            VITE_API_URL_VENTAS=${{ secrets.VITE_API_URL_VENTAS }}
            VITE_API_URL_DESPACHOS=${{ secrets.VITE_API_URL_DESPACHOS }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/frontend-despacho:latest
            docker stop frontend-despacho || true
            docker rm frontend-despacho || true
            docker run -d \
              --name frontend-despacho \
              --restart always \
              -p 80:80 \
              ${{ secrets.DOCKER_USERNAME }}/frontend-despacho:latest